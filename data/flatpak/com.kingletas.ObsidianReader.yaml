# Flatpak manifest -- a starting point, not yet built or verified.
# Build with: flatpak-builder --user --install build data/flatpak/com.kingletas.ObsidianReader.yaml
# The python module sources need pinned sha256 hashes before a real build;
# generate them with flatpak-pip-generator markdown-it-py mdit-py-plugins linkify-it-py pygments pyyaml
app-id: com.kingletas.ObsidianReader
runtime: org.gnome.Platform
runtime-version: "46"
sdk: org.gnome.Sdk
command: obsidian-reader
finish-args:
  # Read-only access to the host filesystem so vaults open in place; no network at all.
  - --filesystem=host:ro
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: obsidian-reader
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --find-links=deps --prefix=/app markdown-it-py mdit-py-plugins linkify-it-py pygments pyyaml
      - pip3 install --no-index --no-deps --prefix=/app .
      - install -Dm644 data/com.kingletas.ObsidianReader.desktop /app/share/applications/com.kingletas.ObsidianReader.desktop
      - install -Dm644 data/com.kingletas.ObsidianReader.metainfo.xml /app/share/metainfo/com.kingletas.ObsidianReader.metainfo.xml
      - install -Dm644 data/com.kingletas.ObsidianReader.svg /app/share/icons/hicolor/scalable/apps/com.kingletas.ObsidianReader.svg
    sources:
      - type: dir
        path: ../..
