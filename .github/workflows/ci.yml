name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      # A software centre reads these two files, and nothing else in the suite
      # touches them. Installed explicitly so the check always runs on CI even
      # though it degrades to a skip on a contributor's machine.
      - name: Validate the desktop entry and AppStream metainfo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y desktop-file-utils appstream
          scripts/validate-metadata.sh

      - name: Test
        run: uv run pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Semgrep
        run: |
          pip install semgrep
          semgrep --config p/python --error --metrics=off src/ tests/ scripts/

  # A tag must not be the first time the packaging runs. The deb is cheap, so it
  # builds on every change; the flatpak downloads a 1.5 GB runtime, so it builds
  # on main only.
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build and install the deb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pip
          packaging/deb/build.sh dist
          sudo apt-get update -qq
          sudo apt-get install -y ./dist/solander_*_all.deb
          # The package must announce the version it was built as.
          declared="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          solander --version | grep -Fx "solander ${declared}"
          solander --sandbox | grep -F 'profile solander /usr/bin/solander'

  flatpak:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install flatpak-builder and the GNOME runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub \
            org.gnome.Platform//50 org.gnome.Sdk//50
      - name: Build it, install it, and prove it carries its dependencies
        run: |
          flatpak-builder --disable-rofiles-fuse --force-clean --repo=repo \
            build data/flatpak/com.kingletas.Solander.yaml
          flatpak build-bundle repo solander.flatpak com.kingletas.Solander
          flatpak install -y --user --noninteractive solander.flatpak
          declared="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          flatpak run --command=solander com.kingletas.Solander --version \
            | grep -Fx "solander ${declared}"
          # --version imports almost nothing. This renders a page, which pulls in
          # every vendored dependency, so a runtime missing one fails here rather
          # than in front of a user.
          flatpak run --command=python3 com.kingletas.Solander -c "
          from solander.core.render import build_page
          import solander.core.frontmatter, solander.core.markdown
          import solander.core.dataview, solander.core.mermaid
          page = build_page('<p>x</p>', 'Note', 'blood-record')
          assert 'theme-blood-record' in page, 'theme did not apply'
          print('flatpak renders, and carries its dependencies')"
          # --version and an in-process render both skip the startup path, so a
          # Flatpak that refuses to start passed both. This is that check.
          flatpak run --command=python3 com.kingletas.Solander -c "
          from solander.cli import sandbox_ready, inside_flatpak
          assert inside_flatpak(), 'not detected as running inside Flatpak'
          assert sandbox_ready(), 'the app would refuse to start in this bundle'
          print('flatpak starts: the sandbox check passes inside the bundle')"
