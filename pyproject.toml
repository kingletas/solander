[project]
name = "solander"
dynamic = ["version"]
description = "A read-only GTK4 reading application that opens a Markdown vault in place and never writes into it"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Luis Tineo", email = "code@kingletas.com" }]
requires-python = ">=3.12"
dependencies = [
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "linkify-it-py>=2.0",
    "pygments>=2.17",
    "pyyaml>=6.0",
    "latex2mathml>=3.81.0",
]

[project.scripts]
solander = "solander.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# The version is the one in src/solander/__init__.py. It reads it from there
# rather than declaring a second literal here, because a deb install has no
# package metadata to ask -- build.sh strips the dist-info -- so the literal
# the application prints has to be the real one.
[tool.hatch.version]
path = "src/solander/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solander"]

[tool.hatch.build.targets.wheel.force-include]
"docs" = "solander/docs"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = [
    # S101: pytest asserts are the house test style.
    "S101",
]

[tool.ruff.lint.per-file-ignores]
# gi.require_version must run before the gi.repository imports it pins.
"src/solander/gui/*" = ["E402"]
"scripts/*" = ["E402"]
# S603: this one runs packaging/version.sh, which is in this repository. The
# point of the test is that the real script is what answers.
"tests/test_versioning.py" = ["S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
