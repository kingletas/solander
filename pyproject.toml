[project]
name = "obsidian-reader"
version = "1.0.0"
description = "A read-only GTK4 reader that opens Obsidian vaults in place and never writes into them"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Luis Tineo", email = "code@kingletas.com" }]
requires-python = ">=3.12"
dependencies = [
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "linkify-it-py>=2.0",
    "pygments>=2.17",
    "pyyaml>=6.0",
    "latex2mathml>=3.81.0",
]

[project.scripts]
obsidian-reader = "obsidian_reader.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_reader"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = [
    # S101: pytest asserts are the house test style.
    "S101",
]

[tool.ruff.lint.per-file-ignores]
# gi.require_version must run before the gi.repository imports it pins.
"src/obsidian_reader/gui/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
